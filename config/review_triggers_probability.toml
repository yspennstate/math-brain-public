# Probability review triggers (schema 2), front G02 of the 12 Oct 2026 brain-improvement run (claude-4a88bc43-g02).
#
# Each [[trigger]] is one recurring failure pattern written as features of a statement or a proof step; `reflex`
# names the failure pattern (one ReflexRecord in the math store per pattern). Matching rules are in
# src/math_brain/triggers.py: anchors are whole words or phrases on normalized text, `context` groups must each
# be present, `unless` silences, and mode "missing" fires only when an anchor is present and a `requires` group
# is absent. A fire is a question for the reader, not a verdict.
#
# Evidence behind the patterns (local, not shipped): Codex AUDIT flags on store cards (shards 000-010, 85 error and
# 139 unclear rows), the OP15/OP16 blind-referee notes, the 27 scar mistakes already in the store, the 100 probability
# hooks of 7 Oct (primary_directive/math_hooks/HOOK_IDEAS_v1.jsonl), and the planted-error misses of the plit audits
# (memories proof_audit_brain_layer_2026_09_07, gpt_and_claude_differ_in_strictness_not_in_catching_planted_errors_2026_10_10).
# The catalogue with its evidence rows: primary_directive/improve_1012/fronts/G02/catalogue.json.

schema_version = 2

# ------------------------------------------------------------------------------------------------ concentration

[[trigger]]
id = "conc-independence"
reflex = "concentration-outside-hypotheses"
title = "a concentration or variance inequality used without independent inputs"
mode = "missing"
keywords = ["Hoeffding", "McDiarmid", "Bernstein's inequality", "Bernstein inequality", "Bernstein bound", "Bennett's inequality",
  "Bennett inequality", "Chernoff Hoeffding", "Efron Stein", "Hanson Wright", "Talagrand's inequality", "Talagrand's concentration",
  "convex distance inequality", "bounded differences inequality", "bounded difference inequality", "method of bounded differences",
  "Kolmogorov's maximal inequality", "Kolmogorov maximal inequality", "Levy's maximal inequality", "Khintchine", "Rosenthal's inequality"]
requires = [["independent", "independence", "independently", "i.i.d.", "iid", "product measure", "product probability", "product space",
  "product of", "martingale", "martingale difference", "negatively associated", "negative association", "Rademacher", "sampling without replacement",
  "Bernoulli percolation", "Erdos Renyi", "G(n,p)", "Poisson point process", "Poisson process", "standard Gaussian", "Gaussian vector"]]
requires_labels = ["independent inputs (or a martingale / product structure)"]
unless = ["Azuma", "Freedman", "Hoeffding's lemma", "Hoeffding lemma", "Hoeffding decomposition", "Janson"]
action = "This inequality controls sums or functions of INDEPENDENT inputs (Azuma and Freedman need martingale differences instead); check that the variables in this use really are independent - not only identically distributed, uncorrelated, or independent of something else."

[[trigger]]
id = "conc-boundedness"
reflex = "concentration-outside-hypotheses"
title = "Hoeffding, Azuma or McDiarmid without almost-sure bounds"
mode = "missing"
keywords = ["Hoeffding", "Azuma", "McDiarmid", "bounded differences inequality", "bounded difference inequality", "method of bounded differences"]
requires = [["bounded", "boundedness", "a_i<=", "<=b_i", "[a,b]", "[a_i,b_i]", "[0,1]", "[-1,1]", "{-1,1}", "{0,1}", "+-1", "|X_i|<=",
  "|X_k|<=", "|D_k|<=", "c_i", "c_k", "sub gaussian", "subgaussian", "psi_2", "Bernoulli", "Rademacher", "indicator", "indicators",
  "values in", "taking values", "range", "differ by at most", "changes by at most", "change by at most", "changing one coordinate",
  "changing a single", "Lipschitz", "increments", "differences", "coin", "signs", "sign"]]
requires_labels = ["an almost-sure bound on the summands, increments or coordinate changes"]
unless = ["Hoeffding decomposition", "Hoeffding's lemma"]
action = "Hoeffding, Azuma and McDiarmid need summands, martingale increments or one-coordinate changes bounded ALMOST SURELY by stated constants; a bound in expectation or with high probability needs a truncated or typical-differences version. Find the constants c_i in this use, or switch to a sub-Gaussian or Bernstein form."

[[trigger]]
id = "tail-bound-direction"
reflex = "inequality-direction"
title = "a tail inequality stated as a lower bound"
mode = "present"
patterns = ['\bp ?\((?:[^()]|\([^()]*\)){1,120}\) ?>= ?(?!1 ?-)(?:2 ?)?(?:exp|e ?\^|e ?\[|e ?\(|e ?x|var|sigma|c ?exp|c ?e ?\^|1 ?/ ?[a-z0-9(])']
context = [["Markov's inequality", "Markov inequality", "Chebyshev", "Hoeffding", "Chernoff", "Bernstein's inequality", "Bernstein inequality",
  "Azuma", "McDiarmid", "Bennett", "Cantelli's inequality", "Gaussian concentration", "Borell TIS", "concentration inequality",
  "union bound", "Boole's inequality", "tail bound", "Freedman"]]
unless = ["Paley Zygmund", "second moment method", "anti concentration", "anticoncentration", "Littlewood Offord", "reverse", "lower tail bound",
  "lower bound on the probability"]
action = "The named inequality bounds a tail probability from ABOVE, but here a probability is bounded BELOW by the tail term. A lower bound needs Paley-Zygmund, the second-moment method or a construction; check the direction of every inequality in this step."

# ------------------------------------------------------------------------------------------------ limit theorems

[[trigger]]
id = "clt-variance"
reflex = "limit-theorem-moment-conditions"
title = "a central limit theorem or invariance principle without a variance condition"
mode = "missing"
keywords = ["central limit theorem", "CLT", "Donsker", "invariance principle", "functional central limit", "Lindeberg Feller",
  "Lindeberg Levy", "de Moivre Laplace"]
requires = [["finite variance", "finite variances", "finite second moment", "finite second moments", "second moment", "second moments",
  "variance sigma^2", "variance sigma", "Var(X", "Var X", "E[X^2]", "E X^2", "E|X|^2", "EX^2", "E(X^2)", "E[X_1^2]", "E X_1^2",
  "square integrable", "L^2", "Lindeberg", "Lyapunov", "bounded", "third moment", "finite moments", "all moments",
  "exponential moments", "sub gaussian", "Bernoulli", "binomial", "unit variance", "variance 1", "variance one", "sigma^2<", "sigma^2 <",
  "0<sigma", "variance in (0", "positive finite variance", "finite positive variance", "mean zero and variance", "mean 0 and variance",
  "covariance matrix", "variance"]]
requires_labels = ["a finite-variance or Lindeberg condition"]
unless = ["stable law", "stable limit", "alpha stable", "infinite variance", "heavy tailed", "heavy tail", "domain of attraction",
  "martingale central limit", "martingale CLT", "open problem"]
action = "A Gaussian limit needs finite variance (iid) or a Lindeberg-type condition (arrays) and centering by the mean; heavy tails give stable limits under another scaling. The text invokes the CLT or an invariance principle but states no second-moment or Lindeberg condition - check that this use has one."

[[trigger]]
id = "berry-esseen-moment"
reflex = "limit-theorem-moment-conditions"
title = "Berry-Esseen without a third moment"
mode = "missing"
keywords = ["Berry Esseen"]
requires = [["third moment", "third absolute moment", "E|X|^3", "E|X_1|^3", "E|X_i|^3", "rho=E", "finite third", "bounded", "Lyapunov",
  "moment of order 3", "2+delta", "3rd moment", "E|xi|^3", "third moments", "|X|^3"]]
requires_labels = ["a finite third absolute moment"]
action = "Berry-Esseen needs a finite third absolute moment and bounds the KOLMOGOROV distance by C rho/(sigma^3 sqrt n); check the moment, and do not quote the rate for another metric."

[[trigger]]
id = "lln-conditions"
reflex = "limit-theorem-moment-conditions"
title = "a law of large numbers without integrability or a dependence structure"
mode = "missing"
keywords = ["strong law of large numbers", "law of large numbers", "SLLN", "WLLN", "strong law", "weak law"]
requires = [["E|X", "E[|X", "integrable", "finite mean", "finite means", "finite expectation", "finite first moment", "L^1", "mean mu",
  "mean zero", "expectation mu", "finite variance", "finite variances", "bounded", "E X_1", "E[X_1]", "EX_1", "finite second moment",
  "uniformly integrable", "sum Var", "Var(X_n)/n^2", "first moment", "moment condition", "E X=", "E[X]=", "mean m", "finite mean m"],
  ["i.i.d.", "iid", "independent", "pairwise independent", "uncorrelated", "stationary", "ergodic", "martingale", "exchangeable", "Etemadi",
  "identically distributed", "Markov chain", "mixing"]]
requires_labels = ["an integrability (first-moment) condition", "a dependence structure (iid, pairwise independent, stationary ergodic, martingale)"]
unless = ["open problem"]
action = "A law of large numbers needs integrability (E|X| finite for iid; a variance or Kolmogorov condition otherwise) and a stated dependence structure (iid, pairwise independent, stationary ergodic, martingale); the text names the law but omits one of them - check which one this use supplies."

# ------------------------------------------------------------------------------------------------ modes of convergence

[[trigger]]
id = "as-from-in-probability-tools"
reflex = "mode-of-convergence-upgraded"
title = "an almost-sure conclusion from in-probability tools"
mode = "missing"
keywords = ["almost surely", "a.s.", "with probability one", "with probability 1", "almost sure"]
context = [["Chebyshev", "Markov's inequality", "Markov inequality", "second moment method", "variance bound", "variance tends",
  "variance goes", "variance ->", "with high probability", "w.h.p.", "whp", "in probability"]]
requires = [["Borel Cantelli", "summable", "summability", "sum_n P", "sum P(", "subsequence", "martingale", "strong law", "SLLN",
  "ergodic theorem", "Birkhoff", "monotone", "Kolmogorov", "Etemadi", "maximal inequality", "fourth moment", "4th moment", "Doob",
  "three series", "Kronecker", "complete convergence", "exponentially small", "exp(-", "e^-", "zero one law", "0 1 law", "tail event",
  "iterated logarithm", "Kingman", "subadditive", "Skorokhod", "coupling", "Glivenko", "a.s. and in probability", "almost surely and in probability"]]
requires_labels = ["a route to almost-sure convergence (Borel-Cantelli with summable tails, a subsequence with monotonicity, a martingale or ergodic theorem)"]
action = "The text concludes 'almost surely' while its tools (Chebyshev or Markov, a variance bound, 'with high probability') give convergence IN PROBABILITY; an almost-sure statement needs summable tail bounds plus Borel-Cantelli, a subsequence and monotonicity argument, or a martingale or ergodic theorem. Check which one this step uses."

[[trigger]]
id = "weak-law-almost-sure"
reflex = "mode-of-convergence-upgraded"
title = "the weak law quoted for an almost-sure statement"
mode = "present"
keywords = ["weak law", "WLLN"]
context = [["almost surely", "a.s.", "with probability one", "with probability 1", "almost sure convergence"]]
unless = ["strong law", "SLLN", "Etemadi", "Kolmogorov"]
action = "The weak law gives convergence in probability only; an almost-sure conclusion needs the strong law (Kolmogorov, Etemadi) or a Borel-Cantelli argument."

[[trigger]]
id = "slutsky-constant"
reflex = "mode-of-convergence-upgraded"
title = "Slutsky without a sequence converging in probability to a constant"
mode = "missing"
keywords = ["Slutsky"]
requires = [["constant", "in probability", "deterministic", "-> c", "->c", "to c", "degenerate"]]
requires_labels = ["one sequence converging in probability to a constant"]
action = "Slutsky combines X_n -> X in distribution with Y_n -> c IN PROBABILITY to a CONSTANT; two sequences converging only in distribution do not combine, because their joint law is not determined."

[[trigger]]
id = "second-borel-cantelli"
reflex = "mode-of-convergence-upgraded"
title = "the second Borel-Cantelli lemma without independence"
mode = "missing"
keywords = ["Borel Cantelli"]
context = [["infinitely often", "i.o.", "infinitely many"], ["diverge", "diverges", "divergent", "=infinity", "is infinite", "not summable", "sum P(A_n)=infinity"]]
requires = [["independent", "independence", "pairwise independent", "Kochen Stone", "Erdos Renyi", "quasi independent", "conditional Borel Cantelli",
  "Levy's extension", "Levy's conditional", "filtration", "martingale", "mixing", "Markov", "nonpositive correlation", "negatively correlated",
  "pairwise nonpositive"]]
requires_labels = ["independence (or a Kochen-Stone, pairwise or conditional version)"]
action = "A divergent sum of P(A_n) gives 'infinitely often' only for independent (or pairwise independent: Erdos-Renyi, Kochen-Stone) events, or through Levy's conditional version with predictable probabilities; the first lemma needs no independence. Check which lemma this use is."

