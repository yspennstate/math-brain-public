keywords = ["Gumbel", "Frechet", "Weibull", "extreme value", "Fisher Tippett", "Gnedenko", "max stable", "extremal types"]
context = [["converge", "converges", "convergence", "limit", "limiting", "normalized", "normalised", "a_n", "b_n", "domain of attraction"]]
requires = [["nondegenerate", "non degenerate", "nontrivial limit", "non trivial limit", "not a point mass", "not degenerate", "non degenerate"]]
requires_labels = ["a nondegenerate limit law"]
action = "The extremal types theorem classifies NONDEGENERATE limits of (M_n - b_n)/a_n with a_n > 0; degenerate limits always exist (constant variables). State that the limit is nondegenerate."

[[trigger]]
id = "critical-point-included"
reflex = "degenerate-case-not-excluded"
title = "a supercritical conclusion stated for p >= p_c"
mode = "present"
patterns = ['(?:>=|at least) ?p_?c\b', '(?:>=|at least) ?p_\{?c\}?\b']
