# ------------------------------------------------------------------------------------------------ martingale tools

[[trigger]]
id = "optional-stopping-condition"
reflex = "martingale-tool-conditions"
title = "optional stopping without a stopping condition"
mode = "missing"
keywords = ["optional stopping", "optional sampling"]
requires = [["bounded stopping time", "bounded stopping times", "T<=", "tau<=", "bounded", "uniformly integrable", "uniform integrability", "UI",
  "E[T]<", "E T<", "ET<", "E[tau]<", "E tau<", "Etau<", "E(T)<", "integrable stopping time", "finite expectation", "bounded increments",
  "dominated", "L^2 bounded", "square integrable", "stopped martingale", "stopped process", "nonnegative supermartingale",
  "non negative supermartingale", "T is bounded", "tau is bounded", "bounded by", "finite mean"]]
requires_labels = ["a stopping condition (T bounded; a uniformly integrable stopped martingale; or E[T] finite with bounded increments)"]
action = "E[M_T] = E[M_0] needs one of: T bounded; the stopped martingale uniformly integrable; or E[T] finite with bounded increments. It fails for simple random walk stopped at its first visit to 1. Check which condition this use has."

[[trigger]]
id = "martingale-convergence-bound"
reflex = "martingale-tool-conditions"
title = "martingale convergence without an L^1 bound"
mode = "missing"
keywords = ["martingale convergence theorem", "martingale convergence", "Doob's convergence", "Doob's martingale convergence", "Doob convergence theorem"]
requires = [["L^1 bounded", "L1 bounded", "bounded in L^1", "bounded in L1", "sup_n E|", "supE|", "sup E|", "sup_n E[|", "uniformly integrable",
  "uniform integrability", "nonnegative", "non negative", "positive", "bounded below", "bounded", "L^2 bounded", "L^p bounded",
  "bounded in L^2", "bounded in L^p", "X_n^+", "sup_n E X_n^+", "closed by", "E[X|F_n]", "E(X|F_n)", "Levy's upward", "reverse martingale",
  "backward martingale"]]
requires_labels = ["an L^1 bound (or nonnegativity)"]
action = "Doob's theorem gives almost-sure convergence for L^1-bounded (sub- or super-)martingales, nonnegative supermartingales included; L^1 convergence also needs uniform integrability, and a uniformly integrable martingale with mean zero cannot have a positive limit. Check which conclusion is drawn and which bound is shown."

[[trigger]]
id = "wald-integrable-time"
reflex = "martingale-tool-conditions"
title = "Wald's identity without an integrable stopping time"
mode = "missing"
keywords = ["Wald's identity", "Wald's equation", "Wald identity", "Wald equation", "Wald's first identity", "Wald's second identity"]
requires = [["E[T]<", "E T<", "ET<", "E[tau]<", "E tau<", "Etau<", "E(T)<", "E(tau)<", "E[N]<", "E N<", "EN<", "integrable stopping time",
  "finite mean", "finite expectation", "bounded stopping time", "integrable"]]
requires_labels = ["an integrable stopping time (E[T] finite)"]
action = "Wald's identity E[S_T] = E[T] E[X_1] needs iid integrable steps and a stopping time with E[T] finite (the second identity also a finite variance); it fails for simple random walk stopped at its first visit to 1, where E[T] is infinite."

[[trigger]]
id = "doob-maximal-conditions"
reflex = "martingale-tool-conditions"
title = "Doob's maximal inequality outside nonnegative submartingales or p > 1"
mode = "missing"
keywords = ["Doob's maximal", "Doob maximal", "Doob's inequality", "Doob's L^p", "Doob L^p", "Doob's submartingale inequality"]
requires = [["submartingale", "martingale", "nonnegative", "non negative", "|M", "|X"], ["p>1", "p > 1", "1<p", "p in (1", "p=2", "L^2", "p/(p-1)",
  "lambda P", "lambda P(", "P(max", "P(sup", "lambda p", "weak type", "L log L", "Llog L"]]
requires_labels = ["a nonnegative submartingale (or |martingale|)", "the range p > 1 for the L^p form (or the weak-type form)"]
action = "Doob's maximal inequality is for nonnegative submartingales (or the absolute value of a martingale); the L^p form needs p > 1 with constant (p/(p-1))^p, which is 4 at p = 2, and fails at p = 1, where an L log L bound replaces it."

# ------------------------------------------------------------------------------------------------ uniformity

[[trigger]]
id = "uniform-from-pointwise"
reflex = "uniformity-dropped"
title = "a uniform conclusion from a pointwise or compact-set argument"
mode = "present"
keywords = ["uniformly in", "uniformly over", "uniform in", "uniformly for", "uniformly with respect", "uniform over", "simultaneously for all",
  "converges uniformly", "uniform convergence", "uniformly on"]
context = [["for each fixed", "for every fixed", "for fixed", "pointwise", "on compact", "on compacts", "compact sets", "compact subsets",
  "locally uniformly", "each fixed", "fixed t", "fixed x", "fixed n", "fixed k", "fixed theta"]]
unless = ["equicontinu*", "Arzela", "Ascoli", "Dini", "epsilon net", "net argument", "chaining", "Glivenko", "uniform law", "Dudley",
  "covering number", "Polya", "finite set", "finitely many", "countable", "separab*", "uniformly on compact", "uniformly on compacts",
  "uniform on compact", "locally uniform", "Lipschitz in"]
action = "The conclusion is uniform (in a parameter, over a class, or as a supremum) while the argument is made for each fixed value or on compact sets. A pointwise bound does not give a uniform one - and convergence of maximizers needs uniform convergence of the criterion: add equicontinuity, a net or chaining argument with control between net points, monotonicity (Polya, Dini), or restrict the claim to compacts."

[[trigger]]
id = "sup-over-uncountable"
reflex = "uniformity-dropped"
title = "a supremum or union bound over an uncountable family"
mode = "missing"
keywords = ["supremum over", "sup over", "union bound over all", "for all t simultaneously", "over an uncountable", "simultaneously for all"]
requires = [["countable", "separable", "separability", "measurable", "outer", "net", "chaining", "dense", "pointwise measurable", "finite class",
  "finitely many", "VC", "Vapnik", "Glivenko", "bracketing", "covering", "continuous", "continuity", "monotone", "Lipschitz"]]
requires_labels = ["a reduction to countably many points (separability, a net, chaining, continuity)"]
action = "A supremum over an uncountable family may be non-measurable, and a union bound over uncountably many events is invalid: reduce to a countable dense set (separability, continuity), or a finite net with control between its points, or use outer expectations."

# ------------------------------------------------------------------------------------------------ degenerate and boundary cases

[[trigger]]
id = "standardized-positive-variance"
reflex = "degenerate-case-not-excluded"
title = "a division by a standard deviation without sigma > 0"
mode = "missing"
patterns = ['\bk ?\*? ?sigma\b', '/ ?sigma\b', '/ ?\(? ?sigma ?\*? ?sqrt', '/ ?sqrt ?\(? ?var', 'standardi[sz]ed', 'divided by (?:its |the )?standard deviation',
  '/ ?\(? ?sqrt ?\(? ?n ?\)? ?sigma']
requires = [["sigma>0", "sigma^2>0", "positive variance", "nondegenerate", "non degenerate", "Var(X)>0", "Var X>0", "Var(X_1)>0", "variance is positive",
  "variance positive", "not a.s. constant", "not almost surely constant", "nonconstant", "non constant", "0<sigma", "0<sigma^2", "sigma^2 in (0",
  "sigma in (0", "positive and finite", "in (0,infinity)", "0<Var", "strictly positive variance", "sigma^2 is positive", "positive finite variance",
  "finite positive variance", "variance 1", "unit variance", "variance one", "sigma=1", "sigma^2=1"]]
requires_labels = ["sigma > 0 (a nondegenerate law)"]
action = "The statement divides by a standard deviation; with sigma = 0 (a constant variable) the standardized event or limit degenerates - Chebyshev's P(|X - mu| >= k sigma) <= 1/k^2 fails for k > 1. State sigma > 0 or treat the degenerate case."

[[trigger]]
id = "extreme-value-nondegenerate"
reflex = "degenerate-case-not-excluded"
